# Include inside your main nginx `server { }` block, e.g.:
#   include /path/to/million-records-test-task/nginx/host-location.conf;
#
# Requires the app image built with VITE_BASE=/million-records-test-task/
# (default in Dockerfile). Docker Compose publishes the stack on port 8080.

location = /million-records-test-task {
    return 301 /million-records-test-task/;
}

location /million-records-test-task/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
